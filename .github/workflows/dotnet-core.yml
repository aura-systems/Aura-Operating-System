name: .NET Core

# Builds the Aura OS ISO on Cosmos gen3 (NativeAOT).
#
# The Cosmos 3.0.89 dev packages Aura pins in global.json are not on nuget.org,
# so this job:
#   1. checks out CosmosOS/Cosmos at a pinned commit,
#   2. builds its local package feed with `make setup`,
#   3. points Aura at it. NuGet.Config expects the sibling ../Cosmos checkout.
# `make setup` stamps the packages with today's date (<base>.<yyyyMMdd>), so
# Aura's global.json Cosmos.Sdk literal is rewritten to that stamp before the
# build. Directory.Build.props derives every other Cosmos version from it.
on:
  workflow_dispatch:
    inputs:
      cosmos_ref:
        description: 'CosmosOS/Cosmos commit SHA (or branch/tag) to build the packages from'
        required: true
        type: string
        default: '6c857b5676596587fcccf164ae6dd680db2104df'

jobs:
  build:
    name: Build Aura OS ISO (Cosmos gen3, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      # actions/checkout only writes under $GITHUB_WORKSPACE, so both repos go
      # there side by side: Cosmos is then ../Cosmos from the Aura checkout.
      - name: Check out Aura
        uses: actions/checkout@v4
        with:
          path: Aura-Operating-System

      - name: Check out Cosmos
        uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: ${{ inputs.cosmos_ref }}
          path: Cosmos
          submodules: recursive   # dotnet/runtime sources + lai (ACPI), as in Cosmos's own CI

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.201'

      # clang (asm/C), ld.lld (link), xorriso (ISO), make + the runner's cc (Limine CLI).
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso make
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the Cosmos packages (make setup)
        working-directory: Cosmos
        run: make setup

      - name: Pin Aura to the stamped Cosmos version
        id: cosmos
        working-directory: Aura-Operating-System
        run: |
          # postCreateCommand.sh rewrites Cosmos's own global.json to the version it stamped.
          VERSION=$(sed -nE 's/.*"Cosmos\.Sdk"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' ../Cosmos/global.json | head -n1)
          if [ -z "$VERSION" ] || [ ! -f "../Cosmos/artifacts/package/release/Cosmos.Sdk.$VERSION.nupkg" ]; then
            echo "::error::Could not determine the stamped Cosmos version (got '$VERSION')"
            ls ../Cosmos/artifacts/package/release/ || true
            exit 1
          fi
          echo "Cosmos packages: $VERSION"
          sed -i -E "s|(\"Cosmos\.Sdk\"[[:space:]]*:[[:space:]]*\")[^\"]+(\")|\1${VERSION}\2|" global.json
          cat global.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Cosmos.Patcher
        working-directory: Aura-Operating-System
        run: |
          dotnet tool uninstall -g Cosmos.Patcher 2>/dev/null || true
          dotnet tool install -g Cosmos.Patcher --add-source ../Cosmos/artifacts/package/release --version "${{ steps.cosmos.outputs.version }}"

      - name: Publish Aura OS
        working-directory: Aura-Operating-System
        run: dotnet publish SRC/Aura_OS/Aura_OS.csproj -c Release -r linux-x64 -o out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Aura_OS-iso
          path: Aura-Operating-System/out/Aura_OS.iso
          if-no-files-found: error
