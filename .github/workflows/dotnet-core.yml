name: .NET Core

# Builds the Aura OS ISO on Cosmos gen3 (NativeAOT) for every push to main and every pull request,
# and publishes a GitHub release when the AuraVersion in SRC/Aura_OS/Aura_OS.csproj has none yet.
#
# The Cosmos 3.0.91 dev packages Aura pins in global.json are not on nuget.org, so the build job:
#   1. checks out CosmosOS/Cosmos at COSMOS_REF,
#   2. builds its local package feed with `make setup`, stamped with the Cosmos.Sdk version from
#      Aura's global.json (VersionPrefix), so Aura needs no rewrite,
#   3. caches that feed per (COSMOS_REF, version), so later commits skip steps 1-2.
# NuGet.Config expects the feed in the sibling ../Cosmos checkout.
#
# Releases keep the gen2 style: tag <version>-<ddMMyyyyHHmm, Paris time>, title "Aura <version>",
# asset Aura-<tag>.iso, text = the version's "## <version>" section of CHANGELOG.md.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release even if this version already has one (main only)'
        type: boolean
        default: false
      cosmos_ref:
        description: 'CosmosOS/Cosmos commit SHA to build the packages from (empty = the pinned one)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # On the gen3 branch of CosmosOS/Cosmos: Aura needs its reorganised API (System.FileSystem,
  # System.Input, the flat System.Network...), its canvas compositing, its TCP, FTP and exception
  # fixes, and the RandomNumberGenerator plug Cosmos.Network.Http 2.1.0 links against.
  COSMOS_REF: ${{ inputs.cosmos_ref || '9f017f7a0b76a8e450aabdab18967dad987e1913' }}
  # v2.1.0 of CosmosOS/Cosmos.Network.Http (https branch), until 2.1.0 is on nuget.org.
  HTTP_REF: 'e7a5838c28b6707a56231715eaaa40efad5ed334'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build Aura OS ISO (Cosmos gen3, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      iso: ${{ steps.version.outputs.iso }}

    steps:
      # actions/checkout only writes under $GITHUB_WORKSPACE, so both repos go
      # there side by side: Cosmos is then ../Cosmos from the Aura checkout.
      - name: Check out Aura
        uses: actions/checkout@v4
        with:
          path: Aura-Operating-System

      - name: Read the versions
        id: version
        working-directory: Aura-Operating-System
        run: |
          VERSION=$(sed -nE 's|.*<AuraVersion>([^<]+)</AuraVersion>.*|\1|p' SRC/Aura_OS/Aura_OS.csproj | head -n1)
          COSMOS_VERSION=$(sed -nE 's/.*"Cosmos\.Sdk"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' global.json | head -n1)
          if [ -z "$VERSION" ] || [ -z "$COSMOS_VERSION" ]; then
            echo "::error::Could not read AuraVersion ('$VERSION') or the Cosmos.Sdk version ('$COSMOS_VERSION')"
            exit 1
          fi
          REVISION=$(TZ=Europe/Paris date +%d%m%Y%H%M)
          TAG="$VERSION-$REVISION"
          echo "Aura $TAG, Cosmos $COSMOS_VERSION from $COSMOS_REF"
          {
            echo "version=$VERSION"
            echo "revision=$REVISION"
            echo "tag=$TAG"
            echo "iso=Aura-$TAG.iso"
            echo "cosmos_version=$COSMOS_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Aura-Operating-System/global.json

      # clang (asm/C), ld.lld (link), xorriso (ISO), make + the runner's cc (Limine CLI).
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso make
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore the Cosmos packages
        id: cosmos-cache
        uses: actions/cache@v4
        with:
          path: Cosmos/artifacts/package/release
          key: cosmos-packages-${{ env.COSMOS_REF }}-${{ steps.version.outputs.cosmos_version }}

      - name: Check out Cosmos
        if: steps.cosmos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: ${{ env.COSMOS_REF }}
          path: Cosmos
          submodules: recursive   # dotnet/runtime sources + lai (ACPI), as in Cosmos's own CI

      - name: Build the Cosmos packages (make setup)
        if: steps.cosmos-cache.outputs.cache-hit != 'true'
        working-directory: Cosmos
        env:
          VersionPrefix: ${{ steps.version.outputs.cosmos_version }}
        # The script ends by restoring Cosmos's whole solution, whose DevKernel needs Cosmos.Network.Telnet
        # (not on nuget.org, not packed by the script). Aura only needs the packages: skip that restore.
        run: |
          sed -i '/^dotnet restore \.\/nativeaot-patcher\.slnx/d' .devcontainer/postCreateCommand.sh
          make setup

      - name: Install Cosmos.Patcher
        working-directory: Aura-Operating-System
        env:
          COSMOS_VERSION: ${{ steps.version.outputs.cosmos_version }}
        run: |
          if [ ! -f "../Cosmos/artifacts/package/release/Cosmos.Sdk.$COSMOS_VERSION.nupkg" ]; then
            echo "::error::Cosmos.Sdk.$COSMOS_VERSION.nupkg is missing from the Cosmos package feed"
            ls ../Cosmos/artifacts/package/release/ || true
            exit 1
          fi
          # Aura's NuGet.Config maps Cosmos.* to that feed (and forbids --add-source).
          dotnet tool uninstall -g Cosmos.Patcher 2>/dev/null || true
          dotnet tool install -g Cosmos.Patcher --version "$COSMOS_VERSION"

      # Packed into the ../Cosmos.Network.Http/artifacts feed Aura's NuGet.Config names for it.
      # Drop these two steps, HTTP_REF and that feed once Cosmos.Network.Http 2.1.0 is on nuget.org.
      - name: Check out Cosmos.Network.Http
        uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos.Network.Http
          ref: ${{ env.HTTP_REF }}
          path: Cosmos.Network.Http

      - name: Pack Cosmos.Network.Http
        working-directory: Cosmos.Network.Http
        run: dotnet pack src/Cosmos.Network.Http/Cosmos.Network.Http.csproj -c Release -o artifacts

      - name: Publish Aura OS
        working-directory: Aura-Operating-System
        env:
          REVISION: ${{ steps.version.outputs.revision }}
          ISO: ${{ steps.version.outputs.iso }}
        run: |
          dotnet publish SRC/Aura_OS/Aura_OS.csproj -c Release -r linux-x64 -o out -p:AuraRevision="$REVISION"
          mv out/Aura_OS.iso "out/$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Aura-${{ steps.version.outputs.tag }}
          path: Aura-Operating-System/out/${{ steps.version.outputs.iso }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      ISO: ${{ needs.build.outputs.iso }}
      FORCE: ${{ inputs.release || false }}

    steps:
      - name: Check out Aura
        uses: actions/checkout@v4

      - name: Look for a release of this version
        id: check
        run: |
          # Published releases are tagged <version>-<revision>; drafts have no tag yet and don't count.
          EXISTING=$(gh release list --limit 100 --json tagName,isDraft \
            | jq -r --arg prefix "$VERSION-" '[.[] | select(.isDraft | not) | .tagName | select(startswith($prefix))] | first // empty')
          if [ -n "$EXISTING" ] && [ "$FORCE" != "true" ]; then
            echo "Aura $VERSION is already released as $EXISTING. Bump AuraVersion in SRC/Aura_OS/Aura_OS.csproj to release again."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the release notes
        if: steps.check.outputs.publish == 'true'
        run: |
          # Lines after "## <version>", up to the next "## " heading.
          awk -v v="$VERSION" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section: add the release notes there"
            exit 1
          fi
          cat notes.md

      - name: Download the ISO
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Aura-${{ needs.build.outputs.tag }}

      - name: Publish the release
        if: steps.check.outputs.publish == 'true'
        run: gh release create "$TAG" "$ISO" --title "Aura $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
